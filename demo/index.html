<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- AiMY: apply the saved theme before first paint (same as ThemeScript) -->
    <script>(function(){try{var t=localStorage.getItem("aimy-ds-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}})()</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiMY UI demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
